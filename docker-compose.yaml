services:
  server:
    build:
      context: ./server
    container_name: leochat-server
    ports:
      - "5000:5000"
    environment:
      - CHAT_PORT=5000
      - CHAT_DEBUG=false
      - WEB_PASSWORD=${WEB_PASSWORD:-}
      - DB_PATH=/data/leochat.db
    volumes:
      - server_data:/data

  agent:
    build:
      context: ./agent
    container_name: leochat-agent
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_data:
